[project]
name = "loop"
version = "0.1.0"
description = "Iterative development CLI implementing the RLCR workflow"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FrankDan77", email = "FrankDan7719@proton.me" }]
requires-python = ">=3.10"

# External dependencies — add here when needed, managed by uv
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/FrankDan77/loop"
Repository = "https://github.com/FrankDan77/loop"

[tool.uv]
# uv is the recommended way to manage the dev environment for this project.
# Install uv: https://docs.astral.sh/uv/getting-started/installation/
#
# Common commands:
#   uv sync                  Install all dependencies into a local .venv
#   uv sync --extra dev      Include dev dependencies (pytest etc.)
#   uv run python scripts/loop.py   Run a script inside the managed environment
#   uv add <package>         Add a new dependency
#   uv add --dev <package>   Add a dev-only dependency

# This project is script-based, not a package — no build backend needed
# The loop CLI is symlinked to ~/.local/bin/loop by install-local.sh
