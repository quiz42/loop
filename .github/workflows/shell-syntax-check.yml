name: Shell Syntax Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  shell-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Find shell scripts
        id: find-scripts
        run: |
          scripts=$(find . -name "*.sh" -type f -not -path "./.git/*" | sort)
          echo "scripts<<EOF" >> "$GITHUB_OUTPUT"
          echo "$scripts" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check bash syntax
        run: |
          exit_code=0
          while IFS= read -r script; do
            if [ -n "$script" ]; then
              echo "Checking bash syntax: $script"
              bash -n "$script" || exit_code=1
            fi
          done <<< "${{ steps.find-scripts.outputs.scripts }}"
          exit "$exit_code"

      - name: Check zsh syntax
        run: |
          exit_code=0
          while IFS= read -r script; do
            if [ -n "$script" ]; then
              echo "Checking zsh syntax: $script"
              zsh -n "$script" || exit_code=1
            fi
          done <<< "${{ steps.find-scripts.outputs.scripts }}"
          exit "$exit_code"
