name: Run All Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  run-all-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run all tests
        run: bash tests/run-all-tests.sh
