name: PR Target Branch Check

on:
  pull_request:
    branches: [main, dev]

jobs:
  check-target-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch targeting rules
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"

          if [ "$TARGET" = "main" ] && [ "$SOURCE" != "dev" ]; then
            echo "Only the dev branch can target main."
            echo "Please change the base branch of this PR to dev."
            exit 1
          fi

          echo "Branch targeting rule satisfied."
